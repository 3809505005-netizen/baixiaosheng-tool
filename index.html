<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百晓生 - 抖音文案提取工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="py-12 px-4">
    <div class="max-w-3xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-10">
            <h1 class="text-5xl font-light text-gray-800 mb-2">百晓生</h1>
            <p class="text-gray-500">内部自用 · 每次最多处理10条链接</p>
        </div>

        <!-- 密码验证弹窗 -->
        <div id="passwordModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div class="glass-card p-8 w-full max-w-md">
                <h2 class="text-2xl font-medium text-gray-800 mb-6 text-center">请输入访问密码</h2>
                <input 
                    type="password" 
                    id="passwordInput" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
                    placeholder="输入密码..."
                    onkeypress="if(event.key === 'Enter') checkPassword()"
                >
                <button 
                    onclick="checkPassword()" 
                    class="w-full btn-primary text-white py-3 rounded-lg font-medium"
                >
                    进入
                </button>
                <p id="passwordError" class="text-red-500 text-center mt-3 hidden">密码错误，请重试</p>
            </div>
        </div>

        <!-- 主内容 -->
        <div id="mainContent" class="hidden">
            <!-- 输入区域 -->
            <div class="glass-card p-6 mb-6">
                <textarea 
                    id="urlInput" 
                    class="w-full h-40 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none mb-4"
                    placeholder="粘贴抖音分享内容或链接..."
                ></textarea>
                <div class="flex gap-3">
                    <button 
                        onclick="extractTexts()" 
                        id="extractBtn"
                        class="btn-primary text-white px-6 py-3 rounded-lg font-medium flex-1"
                    >
                        提取文案
                    </button>
                    <button 
                        onclick="copyAll()" 
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium transition-colors"
                    >
                        复制全部
                    </button>
                    <button 
                        onclick="clearAll()" 
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium transition-colors"
                    >
                        清空
                    </button>
                </div>
            </div>

            <!-- 结果区域 -->
            <div id="resultsContainer" class="space-y-4">
                <!-- 结果卡片会在这里动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 密码验证
        const CORRECT_PASSWORD = "BXS2206";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === CORRECT_PASSWORD) {
                document.getElementById('passwordModal').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
            } else {
                document.getElementById('passwordError').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('passwordError').classList.add('hidden');
                }, 2000);
            }
        }

        // 修正后的链接提取函数（强制提取所有抖音链接）
        function extractUrls(text) {
            const douyinRegex = /https?:\/\/(v\.douyin\.com|www\.douyin\.com|iesdouyin\.com)\/[^\s]+/g;
            const matches = text.match(douyinRegex);
            return matches || [];
        }

        // 提取文案
        async function extractTexts() {
            const inputText = document.getElementById('urlInput').value;
            const urls = extractUrls(inputText);
            
            if (urls.length === 0) {
                alert("请输入内容");
                return;
            }

            if (urls.length > 10) {
                alert("每次最多处理10条链接");
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '';

            // 创建结果卡片
            urls.forEach((url, index) => {
                createResultCard(index, url, 'pending');
            });

            // 禁用提取按钮
            const extractBtn = document.getElementById('extractBtn');
            extractBtn.disabled = true;
            extractBtn.textContent = '提取中...';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ urls })
                });

                const data = await response.json();
                
                if (data.results) {
                    data.results.forEach((result, index) => {
                        updateResultCard(index, result);
                    });
                }
            } catch (error) {
                urls.forEach((url, index) => {
                    updateResultCard(index, { success: false, error: error.message, url });
                });
            }

            // 恢复提取按钮
            extractBtn.disabled = false;
            extractBtn.textContent = '提取文案';
        }

        // 创建结果卡片
        function createResultCard(index, url, status) {
            const card = document.createElement('div');
            card.className = 'glass-card p-5 fade-in';
            card.id = `result-card-${index}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="font-light text-gray-500">文案 ${index+1}</div>
                    <div class="flex gap-2">
                        <button class="btn-small" onclick="copySingleResult(${index})">复制</button>
                        <button class="btn-small" onclick="retryExtract(${index})">重试</button>
                    </div>
                </div>
                <div id="card-content-${index}" class="text-gray-700 text-sm leading-relaxed">处理中...</div>
            `;
            
            document.getElementById('resultsContainer').appendChild(card);
        }

        // 更新结果卡片
        function updateResultCard(index, result) {
            const contentDiv = document.getElementById(`card-content-${index}`);
            
            if (result.success) {
                contentDiv.textContent = result.text;
                contentDiv.className = 'text-gray-700 text-sm leading-relaxed whitespace-pre-wrap';
            } else {
                contentDiv.innerHTML = `<span class="text-red-500">提取失败: ${result.error}</span>`;
            }
        }

        // 复制单个结果
        function copySingleResult(index) {
            const content = document.getElementById(`card-content-${index}`).textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert("已复制到剪贴板");
            });
        }

        // 重试单个提取
        async function retryExtract(index) {
            const inputText = document.getElementById('urlInput').value;
            const urls = extractUrls(inputText);
            const url = urls[index];
            
            const contentDiv = document.getElementById(`card-content-${index}`);
            contentDiv.textContent = '重试中...';
            
            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ urls: [url] })
                });

                const data = await response.json();
                
                if (data.results && data.results[0]) {
                    updateResultCard(index, data.results[0]);
                }
            } catch (error) {
                updateResultCard(index, { success: false, error: error.message, url });
            }
        }

        // 复制全部
        function copyAll() {
            const results = document.querySelectorAll('[id^="card-content-"]');
            let allText = '';
            
            results.forEach((result, index) => {
                if (result.textContent !== '处理中...') {
                    allText += `【文案 ${index+1}】\n${result.textContent}\n\n`;
                }
            });
            
            if (allText) {
                navigator.clipboard.writeText(allText.trim()).then(() => {
                    alert("已复制全部文案");
                });
            }
        }

        // 清空
        function clearAll() {
            document.getElementById('urlInput').value = '';
            document.getElementById('resultsContainer').innerHTML = '';
        }

        // 页面加载完成后聚焦密码输入框
        window.onload = function() {
            document.getElementById('passwordInput').focus();
        }
    </script>
</body>
</html>
